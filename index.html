<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MR JOO WORLD — Realms Quiz</title>
<style>
:root{--gold:#ffd66b;--gold2:#a86d15;--cyan:#39e7ff;--purple:#b866ff;--green:#36e8a0;--red:#ff4d70;--panel:#030711dd}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#02040a;color:#fff;font-family:Arial,Tahoma,sans-serif}button{font:inherit;color:inherit}.world{position:fixed;inset:0;background:center/cover no-repeat;transition:background-image .8s ease;transform:scale(1.03)}.world:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0005 0%,#0002 37%,#000c 100%),radial-gradient(circle at 50% 40%,transparent 15%,#0008 100%)}.world:after{content:"";position:absolute;inset:-20%;background:linear-gradient(110deg,transparent 43%,#ffffff10 50%,transparent 57%);animation:scan 8s linear infinite}@keyframes scan{to{transform:translateX(30%)}}.app{position:relative;z-index:2;height:100%;max-width:1250px;margin:auto;padding:clamp(9px,2vw,24px);display:flex;flex-direction:column;gap:10px}.top,.ad-slot{background:#020711cf;border:1px solid #ffffff2b;backdrop-filter:blur(14px);box-shadow:0 12px 40px #0009}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:45px;height:45px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,var(--gold),#fff1a8);color:#211606;font-size:25px;font-weight:1000;box-shadow:0 0 24px #ffd66b88}.brand h1{font-size:clamp(17px,2.8vw,30px);margin:0;background:linear-gradient(90deg,#fff,var(--gold),var(--purple));-webkit-background-clip:text;color:transparent}.brand small{display:block;color:#bdc8dc;font-size:9px;letter-spacing:1px}.hud{display:flex;gap:7px}.pill{min-width:72px;text-align:center;border:1px solid #ffffff22;border-radius:11px;padding:5px 9px;background:#ffffff0a}.pill small{display:block;color:#b5bfd3;font-size:9px}.pill b{font-size:17px;color:var(--gold)}.ad-slot{min-height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 10px;color:#aebbd1;font-size:10px;overflow:hidden}.ad-slot:empty{display:none}.ad-slot .ad-label{color:#71809a;font-size:8px}.ad-slot button{border:1px solid #ffffff22;background:#ffffff0d;border-radius:7px;padding:2px 7px;font-size:9px;cursor:pointer}.arena{width:min(930px,100%);margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:0}.meta{width:100%;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800}.meta b{color:var(--gold)}.bar{height:5px;flex:1;background:#ffffff20;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--cyan),var(--gold));box-shadow:0 0 15px var(--cyan);transition:.35s}.timer{width:84px;height:84px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--time)*1%),#ffffff19 0);box-shadow:0 0 30px #ffd66b55}.timer:before{content:"";position:absolute;width:72px;height:72px;border-radius:50%;background:#050913;border:1px solid #ffffff22}.timer div{position:relative;text-align:center}.timer b{display:block;color:var(--gold);font-size:26px}.timer small{font-size:8px;letter-spacing:2px}.timer.danger{background:conic-gradient(var(--red) calc(var(--time)*1%),#ffffff19 0)}.timer.danger b{color:var(--red)}.question{position:relative;width:100%;min-height:175px;padding:28px 22px;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#020711e8,#14081ddd);border:2px solid #e3b74fbb;border-radius:25px;box-shadow:0 25px 80px #000c,inset 0 0 40px #ffffff08;overflow:hidden}.question:before{content:"";position:absolute;inset:9px;border:1px solid #ffffff20;border-radius:18px}.question h2{position:relative;margin:0;font-size:clamp(22px,3.3vw,44px);line-height:1.48;text-shadow:0 4px 25px #000}.question span{position:absolute;right:15px;top:11px;color:var(--gold);font-size:10px}.answers{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer{min-height:67px;display:flex;align-items:center;gap:11px;text-align:right;padding:10px 13px;border:2px solid #ffffff24;border-radius:16px;background:linear-gradient(135deg,#091424ed,#030810ed);cursor:pointer;transition:.2s;box-shadow:0 12px 28px #0009}.answer:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 0 28px #39e7ff33}.answer .letter{width:39px;height:39px;flex:0 0 39px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--gold);color:var(--gold);font-size:20px;font-weight:1000;background:#ffd66b12}.answer .text{font-size:clamp(14px,1.7vw,21px);font-weight:850}.answer.correct{border-color:var(--green);background:#073629e8;box-shadow:0 0 28px #36e8a066}.answer.wrong{border-color:var(--red);background:#3d0b17e8;box-shadow:0 0 28px #ff4d7066}.answer.locked{pointer-events:none;opacity:.85}.feedback{width:100%;min-height:38px;padding:9px;text-align:center;border-radius:12px;background:#020711d9;border:1px solid #ffffff22;color:#d5deed;font-size:12px}.feedback.good{color:#aaffd9;border-color:#36e8a066}.feedback.bad{color:#ffc1cb;border-color:#ff4d7066}.modal{position:fixed;inset:0;z-index:6;display:none;place-items:center;padding:18px;background:#01030bdd;backdrop-filter:blur(12px)}.modal.show{display:grid}.modal-card{width:min(520px,94vw);padding:28px;text-align:center;border-radius:24px;background:#050a15f5;border:1px solid #ffd66b99;box-shadow:0 30px 100px #000}.modal-card h2{margin:0;color:var(--gold);font-size:30px}.modal-card p{color:#b9c5d8;line-height:1.8}.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:900;cursor:pointer}.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#180e03}.dark{background:#ffffff12;border:1px solid #ffffff25;margin-right:8px}.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(max-width:650px){.app{padding:7px;gap:7px}.top{padding:7px}.brand small{display:none}.pill{min-width:62px}.arena{width:100%}.answers{grid-template-columns:1fr;gap:8px}.question{min-height:150px;padding:26px 13px}.answer{min-height:57px}.timer{width:74px;height:74px}.timer:before{width:63px;height:63px}.timer b{font-size:22px}.meta{font-size:10px}}
</style>
</head>
<body>
<div class="world" id="world"></div><div class="app"><header class="top"><div class="brand"><div class="logo">M</div><div><h1>MR JOO WORLD</h1><small>REALMS • QUIZ • KNOWLEDGE</small></div></div><div class="hud"><div class="pill"><small>النقاط</small><b id="score">0</b></div><div class="pill"><small>السلسلة</small><b id="streak">0</b></div></div></header><div class="ad-slot" id="adTop"><span class="ad-label">إعلان</span><span>مساحة إعلانية اختيارية — لا تظهر حتى تضيف كود المعلن</span><button onclick="this.parentElement.remove()">إخفاء</button></div><main class="arena"><div class="meta"><b id="round">الجولة 1 / 4</b><div class="bar"><i id="progress"></i></div><span id="remaining">50 سؤال</span></div><div class="timer" id="timer"><div><b id="seconds">30</b><small>SEC</small></div></div><section class="question"><span id="questionNo">السؤال 1 / 50</span><h2 id="questionText">جاري فتح البوابة...</h2></section><div class="answers" id="answers"></div><div class="feedback" id="feedback">اختر إجابة لفتح المرحلة التالية.</div></main><div class="ad-slot" id="adBottom"><span class="ad-label">إعلان</span><span>ادعم اللعبة بإعلان محترم غير مزعج</span><button onclick="this.parentElement.remove()">إخفاء</button></div></div><div class="modal" id="modal"><div class="modal-card"><h2>اكتملت الجولة</h2><p id="modalText"></p><button class="btn gold" id="continue">الجولة التالية</button><button class="btn dark" id="reset">دورة جديدة</button></div></div>
<script>
const BANK=[['علوم','ما الكوكب المعروف بالكوكب الأحمر؟',['الزهرة','المريخ','عطارد','نبتون'],1],['علوم','ما الغاز الأكثر وفرة في الغلاف الجوي؟',['الأكسجين','النيتروجين','الهيدروجين','الهيليوم'],1],['علوم','ما العضو الذي يضخ الدم؟',['الكبد','القلب','الرئة','المعدة'],1],['علوم','ما أكبر عضو في جسم الإنسان؟',['القلب','الجلد','الكبد','الدماغ'],1],['علوم','ما الجسيم سالب الشحنة؟',['البروتون','النيوترون','الإلكترون','الفوتون'],2],['جغرافيا','ما أكبر محيط في العالم؟',['الأطلسي','الهندي','الهادئ','المتجمد'],2],['جغرافيا','ما عاصمة اليابان؟',['بكين','طوكيو','سيول','بانكوك'],1],['جغرافيا','ما أكبر قارة مساحة؟',['أفريقيا','آسيا','أوروبا','أستراليا'],1],['جغرافيا','ما عاصمة أستراليا؟',['سيدني','ملبورن','كانبيرا','بيرث'],2],['تاريخ','من أول الخلفاء الراشدين؟',['عمر','أبو بكر','عثمان','علي'],1],['تاريخ','أين بُنيت الأهرامات الشهيرة؟',['العراق','مصر','اليونان','الهند'],1],['رياضيات','ما ناتج 12 × 8؟',['84','96','108','72'],1],['رياضيات','ما الجذر التربيعي لـ144؟',['10','12','14','16'],1],['رياضيات','ما قيمة 25% من 200؟',['25','50','75','100'],1],['دين','ما أول سورة نزلت؟',['الفاتحة','العلق','البقرة','النمل'],1],['دين','كم عدد ركعات صلاة الفجر؟',['2','3','4','1'],0],['دين','إلى أي مدينة هاجر النبي ﷺ؟',['مكة','المدينة المنورة','دمشق','القدس'],1],['دين','ما أول قبلة للمسلمين؟',['المسجد الأقصى','الكعبة','مسجد قباء','غار حراء'],0],['ثقافة','ما علم دراسة الخرائط؟',['علم الفلك','علم الخرائط','علم الأحياء','علم النبات'],1],['ثقافة','ما اللغة الرسمية في البرازيل؟',['الإسبانية','البرتغالية','الفرنسية','الإنجليزية'],1],['عام','كم عدد أيام الأسبوع؟',['5','6','7','8'],2],['عام','ما الحيوان الملقب بسفينة الصحراء؟',['الحصان','الجمل','الفيل','الأسد'],1],['عام','ما أسرع حيوان بري؟',['الأسد','الفهد','الحصان','الغزال'],1],['عام','كم عدد أسنان الإنسان البالغ غالبًا؟',['28','30','32','36'],2],['عام','ما لون مزج الأزرق مع الأصفر؟',['البنفسجي','الأخضر','البرتقالي','البني'],1]].map((x,id)=>({id,category:x[0],q:x[1],options:x[2],correct:x[3]}));
const BG=['https://iili.io/nob4Q72.png','https://iili.io/nob4Ldl.png','https://iili.io/nob4tm7.png','https://iili.io/nob4ZeS.png','https://iili.io/nob69qb.png','https://iili.io/nob6Jrx.png','https://iili.io/nob62dQ.png'];const $=id=>document.getElementById(id),letters=['A','B','C','D'];let state=JSON.parse(localStorage.getItem('mrjoo_final_v4')||'null')||{round:0,index:0,used:[],score:0,streak:0,cycle:0},current=null,locked=false,timer=null,seconds=30;
function save(){localStorage.setItem('mrjoo_final_v4',JSON.stringify(state))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function bg(){const w=$('world');w.style.backgroundImage=`linear-gradient(180deg,#01030a48,#01030ad4),url("${BG[state.round%BG.length]}")`}
function ui(){$('score').textContent=state.score.toLocaleString('en-US');$('streak').textContent=state.streak;$('round').textContent=`الجولة ${state.round+1} / 4`;$('questionNo').textContent=`السؤال ${state.index+1} / 50`;$('remaining').textContent=`${50-state.index} سؤال`;$('progress').style.width=(state.index/50*100)+'%';bg()}
function timerUi(){$('seconds').textContent=seconds;$('timer').style.setProperty('--time',seconds/30*100);$('timer').classList.toggle('danger',seconds<=7)}function stop(){clearInterval(timer)}function start(){stop();seconds=30;timerUi();timer=setInterval(()=>{seconds--;timerUi();if(seconds<=0){stop();answer(-1)}},1000)}
function nextQuestion(){let a=BANK.filter(q=>!state.used.includes(q.id));if(!a.length){state.used=[];a=BANK}current=a[Math.floor(Math.random()*a.length)];state.used.push(current.id);let items=shuffle(current.options.map((text,index)=>({text,index})));$('questionText').textContent=current.q;$('answers').innerHTML='';items.forEach(it=>{let b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${letters[items.indexOf(it)]}</span><span class="text">${it.text}</span>`;b.onclick=()=>answer(it.index,b);$('answers').appendChild(b)});$('feedback').textContent='اختر إجابة لفتح المرحلة التالية.';$('feedback').className='feedback';locked=false;ui();start()}
function answer(index,clicked){if(locked)return;locked=true;stop();let buttons=[...document.querySelectorAll('.answer')],correctText=current.options[current.correct],correctBtn=buttons.find(b=>b.querySelector('.text')?.textContent===correctText);buttons.forEach(b=>b.classList.add('locked'));if(correctBtn)correctBtn.classList.add('correct');if(clicked&&index!==current.correct)clicked.classList.add('wrong');if(index===current.correct){state.streak++;state.score+=100+seconds*5+state.streak*10;$('feedback').textContent='إجابة صحيحة!';$('feedback').className='feedback good'}else{state.streak=0;state.score=Math.max(0,state.score-20);$('feedback').textContent=index===-1?`انتهى الوقت — الصحيحة: ${correctText}`:`إجابة خاطئة — الصحيحة: ${correctText}`;$('feedback').className='feedback bad'}state.index++;save();ui();setTimeout(()=>{if(state.index>=50){state.round++;state.index=0;state.used=[];save();$('modalText').textContent='أتممت 50 سؤالًا. تم تغيير الخلفية وبدأت جولة جديدة بأسئلة غير مستخدمة.';$('modal').classList.add('show')}else nextQuestion()},850)}
$('continue').onclick=()=>{$('modal').classList.remove('show');nextQuestion()};$('reset').onclick=()=>{state={round:0,index:0,used:[],score:0,streak:0,cycle:state.cycle+1};save();$('modal').classList.remove('show');nextQuestion()};nextQuestion();
</script></body></html>
