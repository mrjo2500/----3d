<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MR JOO WORLD</title>
<style>
:root{--gold:#ffd66b;--purple:#b866ff;--cyan:#42e7ff;--green:#39e8a0;--red:#ff4f72;--panel:#050914e8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02040a;color:#fff;font-family:Arial,Tahoma,sans-serif}body{overflow-x:hidden;overflow-y:auto}.world{position:fixed;inset:0;background:center/cover no-repeat;z-index:0;transition:background-image .8s}.world:after{content:"";position:absolute;inset:0;background:linear-gradient(#0005,#0002 35%,#000e),radial-gradient(circle at 50% 42%,transparent 10%,#000b)}.app{position:relative;z-index:2;min-height:100svh;max-width:1200px;margin:auto;padding:10px;display:flex;flex-direction:column;gap:10px}.top{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid #ffffff30;border-radius:17px;background:#020711d9;backdrop-filter:blur(14px);position:sticky;top:8px;z-index:4}.brand{display:flex;align-items:center;gap:9px}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--gold),#fff1a8);color:#211606;font-size:24px;font-weight:1000}.brand h1{margin:0;font-size:clamp(16px,2.6vw,29px);background:linear-gradient(90deg,#fff,var(--gold),var(--purple));-webkit-background-clip:text;color:transparent}.brand small{display:block;color:#bdc8dc;font-size:9px}.hud{display:flex;gap:6px}.pill{min-width:66px;text-align:center;border:1px solid #ffffff22;border-radius:10px;padding:5px 7px;background:#ffffff0b}.pill small{display:block;color:#b5bfd3;font-size:8px}.pill b{font-size:16px;color:var(--gold)}.arena{width:min(930px,100%);margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:4px 0 18px}.meta{width:100%;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800}.meta b{color:var(--gold)}.bar{height:5px;flex:1;background:#ffffff20;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--cyan),var(--gold));transition:.3s}.timer{width:82px;height:82px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--time)*1%),#ffffff19 0);box-shadow:0 0 30px #ffd66b55}.timer:before{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:#050913;border:1px solid #ffffff22}.timer div{position:relative;text-align:center}.timer b{display:block;color:var(--gold);font-size:25px}.timer small{font-size:8px;letter-spacing:2px}.timer.hidden{visibility:hidden}.question{position:relative;width:100%;min-height:155px;padding:27px 16px;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#020711ed,#14081de8);border:2px solid #e3b74fbb;border-radius:24px;box-shadow:0 20px 60px #000c,inset 0 0 35px #ffffff08}.question:before{content:"";position:absolute;inset:8px;border:1px solid #ffffff20;border-radius:17px}.question h2{position:relative;margin:0;font-size:clamp(21px,3.2vw,42px);line-height:1.48;text-shadow:0 4px 25px #000}.question span{position:absolute;right:14px;top:10px;color:var(--gold);font-size:10px}.answers{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.answer{min-height:72px;display:flex;align-items:center;gap:10px;text-align:right;padding:10px 12px;border:2px solid #ffffff25;border-radius:16px;background:linear-gradient(135deg,#091424f5,#030810f5);cursor:pointer;transition:.2s;box-shadow:0 10px 24px #0009}.answer:hover{transform:translateY(-2px);border-color:var(--cyan)}.answer .letter{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:11px;border:1px solid var(--gold);color:var(--gold);font-size:19px;font-weight:1000;background:#ffd66b12}.answer .text{font-size:clamp(14px,1.7vw,20px);font-weight:850;line-height:1.35}.answer.correct{border-color:var(--green);background:#073629e8;box-shadow:0 0 26px #36e8a066}.answer.wrong{border-color:var(--red);background:#3d0b17e8}.answer.locked{pointer-events:none;opacity:.86}.feedback{width:100%;min-height:38px;padding:9px;text-align:center;border-radius:12px;background:#020711d9;border:1px solid #ffffff22;color:#d5deed;font-size:12px}.feedback.good{color:#aaffd9;border-color:#36e8a066}.feedback.bad{color:#ffc1cb;border-color:#ff4d7066}.intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#02030af5;transition:opacity .8s}.intro.hide{opacity:0;pointer-events:none}.intro-bg{position:absolute;inset:0;background:center/cover no-repeat;filter:brightness(.38)}.intro-card{position:relative;text-align:center;padding:28px}.intro-card img{width:min(82vw,430px);max-height:45vh;object-fit:contain;filter:drop-shadow(0 0 28px #ffd66b66);animation:logoIn 1.3s ease}.intro-card p{font-size:clamp(17px,3vw,28px);letter-spacing:2px;font-weight:900}.start{border:0;border-radius:15px;padding:14px 30px;background:linear-gradient(135deg,var(--gold),#a86d15);font-weight:900;cursor:pointer}.ad{display:none!important}@keyframes logoIn{from{opacity:0;transform:scale(.65) rotateX(40deg);filter:blur(12px)}to{opacity:1;transform:none;filter:drop-shadow(0 0 28px #ffd66b66)}}@media(max-width:650px){.app{padding:7px}.top{position:relative;top:auto}.brand small{display:none}.pill{min-width:60px}.answers{grid-template-columns:1fr}.answer{min-height:62px}.timer{width:74px;height:74px}.timer:before{width:63px;height:63px}.timer b{font-size:22px}}
</style>
</head>
<body>
<div class="world" id="world"></div>
<div class="intro" id="intro"><div class="intro-bg" id="introBg"></div><div class="intro-card"><img src="https://iili.io/noyfWAl.png" alt="MR JOO WORLD"><p>WELCOME IN MR JOO WORLD</p><button class="start" id="start">دخول اللعبة</button></div></div>
<div class="app"><header class="top"><div class="brand"><div class="logo">M</div><div><h1>MR JOO WORLD</h1><small>REALMS • QUIZ • RIDDLES</small></div></div><div class="hud"><div class="pill"><small>النقاط</small><b id="score">0</b></div><div class="pill"><small>السلسلة</small><b id="streak">0</b></div></div></header><main class="arena"><div class="meta"><b id="round">الجولة 1</b><div class="bar"><i id="progress"></i></div><span id="remaining">0 متبقٍ</span></div><div class="timer" id="timer"><div><b id="seconds">30</b><small>SEC</small></div></div><section class="question"><span id="questionNo">السؤال</span><h2 id="questionText">اضغط دخول اللعبة</h2></section><div class="answers" id="answers"></div><div class="feedback" id="feedback">ستظهر أربعة اختيارات هنا.</div></main></div>
<script>
const BG=['https://iili.io/nob4Q72.png','https://iili.io/nob4Ldl.png','https://iili.io/nob4tm7.png','https://iili.io/noyfV94.png'];
const BANK=[['علوم','ما الكوكب المعروف بالكوكب الأحمر؟',['الزهرة','المريخ','عطارد','نبتون'],1],['علوم','ما الغاز الأكثر وفرة في الغلاف الجوي؟',['الأكسجين','النيتروجين','الهيدروجين','الهيليوم'],1],['علوم','ما العضو الذي يضخ الدم؟',['الكبد','القلب','الرئة','المعدة'],1],['علوم','ما أكبر عضو في جسم الإنسان؟',['القلب','الجلد','الكبد','الدماغ'],1],['جغرافيا','ما أكبر محيط في العالم؟',['الأطلسي','الهندي','الهادئ','المتجمد'],2],['جغرافيا','ما عاصمة اليابان؟',['بكين','طوكيو','سيول','بانكوك'],1],['تاريخ','من أول الخلفاء الراشدين؟',['عمر','أبو بكر','عثمان','علي'],1],['رياضيات','ما ناتج 12 × 8؟',['84','96','108','72'],1],['رياضيات','ما الجذر التربيعي لـ144؟',['10','12','14','16'],1],['دين','ما أول سورة نزلت؟',['الفاتحة','العلق','البقرة','النمل'],1],['دين','إلى أي مدينة هاجر النبي ﷺ؟',['مكة','المدينة المنورة','دمشق','القدس'],1],['ثقافة','ما اللغة الرسمية في البرازيل؟',['الإسبانية','البرتغالية','الفرنسية','الإنجليزية'],1],['لغز','ما الذي كلما أخذت منه كبر؟',['العمر','الحفرة','الكتاب','الصوت'],1],['لغز','له أسنان ولا يعض؟',['المنشار','المشط','الحصان','القلم'],1],['لغز','يمشي بلا رجلين ويبكي بلا عينين؟',['السحاب','الصدى','الوقت','الظل'],0],['لغز','ما الشيء الذي إذا نطقت اسمه اختفى؟',['الهدوء','الصمت','الظلام','الحلم'],1],['لغز','له رقبة بلا رأس؟',['الزجاجة','القلم','الطاولة','الباب'],0],['لغز','شيء تملكه ويستعمله الناس أكثر منك؟',['اسمك','مالك','بيتك','هاتفك'],0],['لغز','ما الذي يسمع بلا أذن ويتكلم بلا لسان؟',['الصدى','الهاتف','الكتاب','الريح'],0],['لغز','ما الذي يأتي دائمًا ولا يصل؟',['الغد','الأمس','الصوت','الطريق'],0]].map((x,id)=>({id,cat:x[0],q:x[1],options:x[2],correct:x[3],riddle:x[0]==='لغز'}));
const $=id=>document.getElementById(id),letters=['A','B','C','D'];let state=JSON.parse(localStorage.getItem('mrjoo_final_v8')||'null')||{used:[],score:0,streak:0,round:0,total:0},current=null,locked=true,timer=null,seconds=30;
function save(){localStorage.setItem('mrjoo_final_v8',JSON.stringify(state))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function setBg(){world.style.backgroundImage=`linear-gradient(180deg,#01030a38,#01030ad8),url("${BG[state.round%BG.length]}")`;introBg.style.backgroundImage=`url("https://iili.io/noyfW94.png")`}
function update(){score.textContent=state.score.toLocaleString('en-US');streak.textContent=state.streak;round.textContent=`الجولة ${state.round+1} • الخلفية ${(state.round%BG.length)+1}`;questionNo.textContent=`السؤال ${state.total+1}`;remaining.textContent=`${BANK.length-state.used.length} متبقٍ`;progress.style.width=(state.used.length/BANK.length*100)+'%';setBg()}
function timerUI(){secondsEl.textContent=seconds;timer.style.setProperty('--time',seconds/30*100);timer.classList.toggle('danger',seconds<=7)}function stop(){clearInterval(timer)}function startTimer(){stop();seconds=30;timerUI();timer=setInterval(()=>{seconds--;timerUI();if(seconds<=0){stop();answer(-1)}},1000)}
function render(){let available=BANK.filter(q=>!state.used.includes(q.id));if(!available.length){state.used=[];state.round++;available=BANK}current=available[Math.floor(Math.random()*available.length)];state.used.push(current.id);let items=shuffle(current.options.map((text,index)=>({text,index})));questionText.textContent=current.q;answers.innerHTML='';items.forEach((it,pos)=>{let b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${letters[pos]}</span><span class="text">${it.text}</span>`;b.onclick=()=>answer(it.index,b);answers.appendChild(b)});feedback.textContent=current.riddle?'هذا لغز بلا مؤقت — خذ وقتك.':'أجب خلال 30 ثانية.';feedback.className='feedback';locked=false;update();current.riddle?stop():startTimer()}
function answer(index,clicked){if(locked)return;locked=true;stop();let buttons=[...document.querySelectorAll('.answer')],correctText=current.options[current.correct],correctBtn=buttons.find(b=>b.querySelector('.text')?.textContent===correctText);buttons.forEach(b=>b.classList.add('locked'));if(correctBtn)correctBtn.classList.add('correct');if(clicked&&index!==current.correct)clicked.classList.add('wrong');if(index===current.correct){state.streak++;state.score+=current.riddle?250:100+seconds*5;feedback.textContent='إجابة صحيحة!';feedback.className='feedback good'}else{state.streak=0;state.score=Math.max(0,state.score-20);feedback.textContent=index===-1?`انتهى الوقت — الصحيحة: ${correctText}`:`إجابة خاطئة — الصحيحة: ${correctText}`;feedback.className='feedback bad'}state.total++;save();update();setTimeout(render,current.riddle?1200:750)}
start.onclick=()=>{intro.classList.add('hide');setTimeout(()=>intro.style.display='none',850);render()};update();setBg();
</script>
</body>
</html>
