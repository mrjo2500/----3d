<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>MR JOO WORLD — Realms</title>
<style>
:root{--gold:#ffd66b;--purple:#b866ff;--cyan:#42e7ff;--green:#3ff0aa;--red:#ff4f72;--ink:#eef5ff;--muted:#aebbd2}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#02040a;color:var(--ink);font-family:Arial,Tahoma,sans-serif}button{font:inherit}.world{position:fixed;inset:-3%;background:center/cover no-repeat;transition:background-image .9s ease;animation:drift 18s ease-in-out infinite alternate}.world:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0003,#0001 35%,#000e),radial-gradient(circle at 50% 42%,transparent 10%,#000b 100%)}@keyframes drift{to{transform:scale(1.06) translate(1%,-1%)}}.app{position:relative;z-index:2;width:100%;height:100%;max-width:1250px;margin:auto;padding:clamp(8px,2vw,24px);display:flex;flex-direction:column;gap:10px}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid #ffffff2b;border-radius:18px;background:#020711d9;backdrop-filter:blur(15px);box-shadow:0 12px 40px #0009}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,var(--gold),#fff1a8);color:#211606;font-size:25px;font-weight:1000;box-shadow:0 0 24px #ffd66b88}.brand h1{font-size:clamp(17px,2.8vw,30px);margin:0;background:linear-gradient(90deg,#fff,var(--gold),var(--purple));-webkit-background-clip:text;color:transparent}.brand small{display:block;color:#bdc8dc;font-size:9px;letter-spacing:1px}.hud{display:flex;gap:7px}.pill{min-width:72px;text-align:center;border:1px solid #ffffff22;border-radius:11px;padding:5px 9px;background:#ffffff0a}.pill small{display:block;color:#b5bfd3;font-size:9px}.pill b{font-size:17px;color:var(--gold)}.arena{width:min(930px,100%);margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:0}.meta{width:100%;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800}.meta b{color:var(--gold)}.bar{height:5px;flex:1;background:#ffffff20;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--cyan),var(--gold));box-shadow:0 0 15px var(--cyan);transition:.35s}.timer{width:84px;height:84px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--time)*1%),#ffffff19 0);box-shadow:0 0 30px #ffd66b55}.timer:before{content:"";position:absolute;width:72px;height:72px;border-radius:50%;background:#050913;border:1px solid #ffffff22}.timer div{position:relative;text-align:center}.timer b{display:block;color:var(--gold);font-size:26px}.timer small{font-size:8px;letter-spacing:2px}.timer.hidden{visibility:hidden}.timer.danger{background:conic-gradient(var(--red) calc(var(--time)*1%),#ffffff19 0)}.timer.danger b{color:var(--red)}.question{position:relative;width:100%;min-height:175px;padding:28px 22px;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#020711e8,#14081ddd);border:2px solid #e3b74fbb;border-radius:25px;box-shadow:0 25px 80px #000c,inset 0 0 40px #ffffff08;overflow:hidden;animation:cardIn .55s ease}.question:before{content:"";position:absolute;inset:9px;border:1px solid #ffffff20;border-radius:18px}.question h2{position:relative;margin:0;font-size:clamp(22px,3.3vw,44px);line-height:1.48;text-shadow:0 4px 25px #000}.question span{position:absolute;right:15px;top:11px;color:var(--gold);font-size:10px}.answers{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer{min-height:67px;display:flex;align-items:center;gap:11px;text-align:right;padding:10px 13px;border:2px solid #ffffff24;border-radius:16px;background:linear-gradient(135deg,#091424ed,#030810ed);cursor:pointer;transition:.23s;box-shadow:0 12px 28px #0009;animation:answerIn .45s both}.answer:nth-child(2){animation-delay:.06s}.answer:nth-child(3){animation-delay:.12s}.answer:nth-child(4){animation-delay:.18s}.answer:hover{transform:translateY(-2px) scale(1.01);border-color:var(--cyan);box-shadow:0 0 28px #39e7ff33}.answer .letter{width:39px;height:39px;flex:0 0 39px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--gold);color:var(--gold);font-size:20px;font-weight:1000;background:#ffd66b12}.answer .text{font-size:clamp(14px,1.7vw,21px);font-weight:850}.answer.correct{border-color:var(--green);background:#073629e8;box-shadow:0 0 28px #36e8a066}.answer.wrong{border-color:var(--red);background:#3d0b17e8;box-shadow:0 0 28px #ff4d7066}.answer.locked{pointer-events:none;opacity:.85}.feedback{width:100%;min-height:38px;padding:9px;text-align:center;border-radius:12px;background:#020711d9;border:1px solid #ffffff22;color:#d5deed;font-size:12px}.feedback.good{color:#aaffd9;border-color:#36e8a066}.feedback.bad{color:#ffc1cb;border-color:#ff4d7066}.mode{padding:5px 12px;border-radius:99px;border:1px solid var(--purple);color:#e2c9ff;background:#7627aa44;font-size:11px}.modal{position:fixed;inset:0;z-index:9;display:none;place-items:center;padding:18px;background:#01030bdd;backdrop-filter:blur(12px)}.modal.show{display:grid}.modal-card{width:min(520px,94vw);padding:28px;text-align:center;border-radius:24px;background:#050a15f5;border:1px solid #ffd66b99;box-shadow:0 30px 100px #000}.modal-card h2{margin:0;color:var(--gold);font-size:30px}.modal-card p{color:#b9c5d8;line-height:1.8}.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:900;cursor:pointer}.gold{background:linear-gradient(135deg,var(--gold),#a86d15);color:#180e03}.dark{background:#ffffff12;border:1px solid #ffffff25;margin-right:8px}.fx{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}.particle{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 13px var(--c);animation:boom .9s ease-out forwards}@keyframes boom{to{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}}.flash{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0}.flash.good{animation:flashGood .5s}.flash.bad{animation:flashBad .5s}@keyframes flashGood{0%{opacity:.75;background:#35e8a033}100%{opacity:0}}@keyframes flashBad{0%{opacity:.7;background:#ff4d7044}100%{opacity:0}}@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}@keyframes answerIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:650px){.app{padding:7px;gap:7px}.top{padding:7px}.brand small{display:none}.pill{min-width:62px}.arena{width:100%}.answers{grid-template-columns:1fr;gap:8px}.question{min-height:150px;padding:26px 13px}.answer{min-height:57px}.timer{width:74px;height:74px}.timer:before{width:63px;height:63px}.timer b{font-size:22px}.meta{font-size:10px}}
</style>
</head>
<body>
<div class="world" id="world"></div><div class="fx" id="fx"></div><div class="flash" id="flash"></div><div class="app"><header class="top"><div class="brand"><div class="logo">M</div><div><h1>MR JOO WORLD</h1><small>REALMS • QUIZ • RIDDLES</small></div></div><div class="hud"><div class="pill"><small>النقاط</small><b id="score">0</b></div><div class="pill"><small>السلسلة</small><b id="streak">0</b></div></div></header><main class="arena"><div class="meta"><b id="round">الجولة 1</b><span class="mode" id="mode">سؤال سريع</span><div class="bar"><i id="progress"></i></div><span id="remaining">0 متبقٍ</span></div><div class="timer" id="timer"><div><b id="seconds">30</b><small>SEC</small></div></div><section class="question"><span id="questionNo">السؤال</span><h2 id="questionText">جاري فتح البوابة...</h2></section><div class="answers" id="answers"></div><div class="feedback" id="feedback">اختر إجابة لفتح المرحلة التالية.</div></main></div><div class="modal" id="modal"><div class="modal-card"><h2 id="modalTitle">أكملت الجولة</h2><p id="modalText"></p><button class="btn gold" id="continue">متابعة</button><button class="btn dark" id="reset">دورة جديدة</button></div></div>
<script>
const BG=['https://iili.io/nob4Q72.png','https://iili.io/nob4Ldl.png','https://iili.io/nob4tm7.png','https://iili.io/nob4ZeS.png','https://iili.io/nob69qb.png','https://iili.io/nob6Jrx.png','https://iili.io/nob62dQ.png'];
const QUESTIONS=[['علوم','ما الكوكب المعروف بالكوكب الأحمر؟',['الزهرة','المريخ','عطارد','نبتون'],1],['علوم','ما الغاز الأكثر وفرة في الغلاف الجوي؟',['الأكسجين','النيتروجين','الهيدروجين','الهيليوم'],1],['علوم','ما العضو الذي يضخ الدم؟',['الكبد','القلب','الرئة','المعدة'],1],['علوم','ما أكبر عضو في جسم الإنسان؟',['القلب','الجلد','الكبد','الدماغ'],1],['علوم','ما الجسيم سالب الشحنة؟',['البروتون','النيوترون','الإلكترون','الفوتون'],2],['جغرافيا','ما أكبر محيط في العالم؟',['الأطلسي','الهندي','الهادئ','المتجمد'],2],['جغرافيا','ما عاصمة اليابان؟',['بكين','طوكيو','سيول','بانكوك'],1],['جغرافيا','ما أكبر قارة مساحة؟',['أفريقيا','آسيا','أوروبا','أستراليا'],1],['تاريخ','من أول الخلفاء الراشدين؟',['عمر','أبو بكر','عثمان','علي'],1],['تاريخ','أين بُنيت الأهرامات الشهيرة؟',['العراق','مصر','اليونان','الهند'],1],['رياضيات','ما ناتج 12 × 8؟',['84','96','108','72'],1],['رياضيات','ما الجذر التربيعي لـ144؟',['10','12','14','16'],1],['دين','ما أول سورة نزلت؟',['الفاتحة','العلق','البقرة','النمل'],1],['دين','كم عدد ركعات صلاة الفجر؟',['2','3','4','1'],0],['دين','إلى أي مدينة هاجر النبي ﷺ؟',['مكة','المدينة المنورة','دمشق','القدس'],1],['ثقافة','ما علم دراسة الخرائط؟',['علم الفلك','علم الخرائط','علم الأحياء','علم النبات'],1],['ثقافة','ما اللغة الرسمية في البرازيل؟',['الإسبانية','البرتغالية','الفرنسية','الإنجليزية'],1],['عام','كم عدد أيام الأسبوع؟',['5','6','7','8'],2],['عام','ما الحيوان الملقب بسفينة الصحراء؟',['الحصان','الجمل','الفيل','الأسد'],1],['عام','ما أسرع حيوان بري؟',['الأسد','الفهد','الحصان','الغزال'],1],['لغز','شيء يملأ الغرفة ولا يشغل مكانًا، ما هو؟',['الضوء','الماء','الدخان','الرمل'],0],['لغز','ما الذي كلما أخذت منه كبر؟',['العمر','الحفرة','الكتاب','الصوت'],1],['لغز','له أسنان ولا يعض، ما هو؟',['المنشار','المشط','الحصان','القلم'],1],['لغز','يمشي بلا رجلين ويبكي بلا عينين، ما هو؟',['السحاب','الصدى','الوقت','الظل'],0],['لغز','ما الشيء الذي إذا نطقت اسمه اختفى؟',['الهدوء','الصمت','الظلام','الحلم'],1],['لغز','له رقبة بلا رأس، ما هو؟',['الزجاجة','القلم','الطاولة','الباب'],0],['لغز','ما الذي يكتب ولا يقرأ؟',['القلم','الكتاب','الحبر','الطابع'],0],['لغز','شيء تملكه ويستعمله الناس أكثر منك، ما هو؟',['اسمك','مالك','بيتك','هاتفك'],0],['لغز','ما الذي يسمع بلا أذن ويتكلم بلا لسان؟',['الصدى','الهاتف','الكتاب','الريح'],0],['لغز','له عين ولا يرى، ما هو؟',['الإبرة','القمر','النهر','الساعة'],0],['لغز','ما الذي كلما زاد نقص؟',['العمر','المال','الطول','العلم'],0],['لغز','ما الشيء الذي يأتي دائمًا ولا يصل؟',['الغد','الأمس','الصوت','الطريق'],0],['لغز','بيت بلا أبواب ولا نوافذ وفيه ساكن، ما هو؟',['البيضة','البيت','الكهف','الكتاب'],0],['لغز','ما الذي له وجه ويدان ولا يملك أصابع؟',['الساعة','الإنسان','القمر','الباب'],0],['لغز','شيء إذا تركته عاش وإذا أمسكته مات، ما هو؟',['النفس','النار','الماء','السمك'],0],['لغز','ما الذي يضيء للآخرين ويحرق نفسه؟',['الشمعة','الشمس','المصباح','النار'],0],['لغز','له فم ولا يأكل وله مجرى ولا يمشي، ما هو؟',['النهر','الكوب','الإنسان','الطريق'],0],['لغز','ما الذي يمكن كسره دون لمسه؟',['الوعد','الزجاج','الحجر','الباب'],0],['لغز','ما الذي تراه في الليل ثلاث مرات وفي النهار مرة؟',['حرف اللام','القمر','النجوم','الظل'],0],['لغز','ما الذي يسافر حول العالم وهو ثابت في مكانه؟',['ا��طابع البريدي','الطائرة','الخريطة','الريح'],0]].map((x,id)=>({id,category:x[0],q:x[1],options:x[2],correct:x[3],riddle:x[0]==='لغز'}));
const $=id=>document.getElementById(id),letters=['A','B','C','D'];let state=JSON.parse(localStorage.getItem('mrjoo_creative_v6')||'null')||{round:0,index:0,used:[],score:0,streak:0,total:0},current=null,locked=false,timer=null,seconds=30;
function save(){localStorage.setItem('mrjoo_creative_v6',JSON.stringify(state))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function setBg(){world.style.backgroundImage=`linear-gradient(180deg,#01030a38,#01030ad8),url("${BG[state.round%BG.length]}")`}
function ui(){$('score').textContent=state.score.toLocaleString('en-US');$('streak').textContent=state.streak;$('round').textContent=`الجولة ${state.round+1} • الصورة ${(state.round%BG.length)+1}`;$('questionNo').textContent=`${current?.riddle?'اللغز':'السؤال'} ${state.index+1}`;$('remaining').textContent=`${QUESTIONS.length-state.used.length} متبقٍ`;$('progress').style.width=(state.used.length/QUESTIONS.length*100)+'%';$('mode').textContent=current?.riddle?'لغز مفتوح — بلا مؤقت':'سؤال سريع — 30 ثانية';timer.classList.toggle('hidden',!!current?.riddle);setBg()}
function timerUi(){secondsEl.textContent=seconds;timer.style.setProperty('--time',seconds/30*100);timer.classList.toggle('danger',seconds<=7)}function stop(){clearInterval(timer)}function start(){stop();seconds=30;timerUi();timer=setInterval(()=>{seconds--;timerUi();if(seconds<=0){stop();answer(-1)}},1000)}
function burst(color){for(let i=0;i<42;i++){const p=document.createElement('i');p.className='particle';p.style.setProperty('--c',color);p.style.left='50%';p.style.top='45%';const a=Math.random()*Math.PI*2,r=80+Math.random()*Math.min(innerWidth,innerHeight)*.5;p.style.setProperty('--x',Math.cos(a)*r+'px');p.style.setProperty('--y',Math.sin(a)*r+'px');fx.appendChild(p);setTimeout(()=>p.remove(),1000)}}
function tone(kind){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain(),f=kind==='good'?[520,660,820]:[180,130];o.type=kind==='good'?'sine':'sawtooth';o.frequency.value=f[0];f.slice(1).forEach((v,i)=>o.frequency.setValueAtTime(v,c.currentTime+(i+.1)*.1));g.gain.value=.07;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.35);setTimeout(()=>c.close(),500)}catch(e){}}
function render(){let a=QUESTIONS.filter(q=>!state.used.includes(q.id));if(!a.length){state.used=[];a=QUESTIONS}current=a[Math.floor(Math.random()*a.length)];state.used.push(current.id);let items=shuffle(current.options.map((text,index)=>({text,index})));questionText.textContent=current.q;answers.innerHTML='';items.forEach((it,pos)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${letters[pos]}</span><span class="text">${it.text}</span>`;b.onclick=()=>answer(it.index,b);answers.appendChild(b)});feedback.textContent=current.riddle?'فكّر براحتك — هذا اللغز بلا مؤقت.':'أجب قبل انتهاء الوقت.';feedback.className='feedback';locked=false;ui();current.riddle?stop():start()}
function answer(index,clicked){if(locked)return;locked=true;stop();const buttons=[...document.querySelectorAll('.answer')],text=current.options[current.correct],correct=buttons.find(b=>b.querySelector('.text')?.textContent===text);buttons.forEach(b=>b.classList.add('locked'));if(correct)correct.classList.add('correct');if(clicked&&index!==current.correct)clicked.classList.add('wrong');if(index===current.correct){state.streak++;const reward=current.riddle?250:100+seconds*5;state.score+=reward;feedback.textContent=`إجابة صحيحة! +${reward}`;feedback.className='feedback good';burst('#36e8a0');tone('good')}else{state.streak=0;state.score=Math.max(0,state.score-20);feedback.textContent=index===-1?`انتهى الوقت — الصحيحة: ${text}`:`إجابة خاطئة — الصحيحة: ${text}`;feedback.className='feedback bad';burst('#ff4d70');tone('bad')}state.total++;save();ui();setTimeout(()=>render(),current.riddle?1700:850)}
$('reset').onclick=()=>{state={round:0,index:0,used:[],score:0,streak:0,total:0};save();modal.classList.remove('show');render()};
render();
</script></body></html>
