<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MR JOO WORLD — Endless Quiz</title>
<style>
:root{--gold:#f6c85f;--gold2:#9d6b19;--cyan:#45d9ff;--purple:#a46cff;--green:#39e6a0;--red:#ff5570;--bg:#03050b;--panel:rgba(5,9,18,.82);--line:rgba(255,214,105,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Tajawal,Arial,sans-serif}button{font:inherit;color:inherit}
body{background:radial-gradient(circle at 50% 15%,#17264d 0,transparent 34%),linear-gradient(135deg,#02040a,#100c20 50%,#03050b)}
body:before{content:"";position:fixed;inset:0;opacity:.65;background:radial-gradient(circle at 12% 25%,#16456b55,transparent 25%),radial-gradient(circle at 85% 22%,#7a32b055,transparent 27%),linear-gradient(115deg,transparent 45%,#ffffff08 50%,transparent 55%);pointer-events:none}
.app{position:relative;width:100%;height:100%;max-width:1180px;margin:auto;display:flex;flex-direction:column;padding:18px;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid #ffffff18;border-radius:20px;background:var(--panel);backdrop-filter:blur(16px);box-shadow:0 15px 45px #0008;z-index:2}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--gold),#fff0a7);color:#15100a;font-size:25px;font-weight:1000;box-shadow:0 0 25px #f6c85f66}.brand h1{margin:0;font-size:clamp(18px,3vw,30px);background:linear-gradient(90deg,#fff,var(--gold),var(--purple));-webkit-background-clip:text;color:transparent}.brand small{display:block;color:#9fa8bd;font-size:10px;letter-spacing:1px}.hud{display:flex;gap:8px}.pill{min-width:82px;text-align:center;border:1px solid #ffffff17;border-radius:12px;padding:6px 10px;background:#ffffff08}.pill small{display:block;color:#9ca7c0;font-size:9px}.pill b{font-size:18px;color:var(--gold)}
.main{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.arena{width:min(920px,96vw);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px}.stage-line{width:100%;display:flex;justify-content:space-between;align-items:center;color:#aeb8ce;font-size:12px}.category{color:var(--gold);font-weight:900}.meter{height:5px;flex:1;max-width:360px;margin:0 14px;background:#ffffff12;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--cyan),var(--gold));box-shadow:0 0 14px var(--cyan);transition:.35s}
.timer{position:relative;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--time)*1%),#ffffff12 0);box-shadow:0 0 34px #f6c85f33}.timer:before{content:"";position:absolute;inset:6px;border-radius:50%;background:#070b14;border:1px solid #ffffff18}.timer b,.timer small{position:relative;display:block;text-align:center}.timer b{font-size:29px;color:var(--gold)}.timer small{font-size:8px;letter-spacing:2px;color:#aab4c7}.timer.danger{background:conic-gradient(var(--red) calc(var(--time)*1%),#ffffff12 0);box-shadow:0 0 35px #ff557055}.timer.danger b{color:var(--red)}
.question-card{position:relative;width:100%;min-height:190px;padding:30px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#080d18ee,#100b20ee);border:2px solid var(--line);border-radius:26px;box-shadow:0 20px 70px #0009,inset 0 0 40px #ffffff05;overflow:hidden}.question-card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,#ffffff08,transparent);transform:translateX(-100%);animation:shine 5s infinite}.question-card h2{position:relative;margin:0;font-size:clamp(22px,3.2vw,42px);line-height:1.5;text-shadow:0 4px 20px #000}.question-card .number{position:absolute;top:12px;right:16px;color:#aab6cc;font-size:11px}.question-card .hint{position:relative;margin-top:9px;color:#8794ae;font-size:12px}@keyframes shine{45%,100%{transform:translateX(100%)}}
.answers{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answer{min-height:74px;border:1px solid #ffffff20;border-radius:17px;background:linear-gradient(135deg,#111a2aee,#080d17ee);cursor:pointer;text-align:right;padding:12px 16px;display:flex;align-items:center;gap:12px;transition:.2s;box-shadow:0 12px 28px #0006}.answer:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 0 25px #45d9ff22}.letter{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--gold);color:var(--gold);font-weight:1000;background:#f6c85f0d}.answer span:last-child{font-size:clamp(14px,1.7vw,21px);font-weight:800}.answer.correct{border-color:var(--green);background:#0b3027dd;box-shadow:0 0 30px #39e6a044}.answer.wrong{border-color:var(--red);background:#350d17dd;box-shadow:0 0 30px #ff557044}.answer.locked{pointer-events:none;opacity:.82}
.feedback{width:100%;min-height:44px;padding:10px 14px;text-align:center;border-radius:14px;background:#ffffff08;border:1px solid #ffffff12;color:#cbd4e5;font-size:13px}.feedback.good{border-color:#39e6a066;color:#9ff7ce}.feedback.bad{border-color:#ff557066;color:#ffc2cb}.controls{display:flex;gap:10px}.btn{border:0;border-radius:13px;padding:12px 28px;font-weight:900;cursor:pointer}.next{background:linear-gradient(135deg,var(--gold),#bd7f1c);color:#171008;display:none}.next.show{display:block}.restart{background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff}
.modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#02040bcc;backdrop-filter:blur(10px);padding:20px}.modal.show{display:grid}.modal-card{width:min(520px,92vw);padding:28px;text-align:center;border-radius:24px;background:#080d18f5;border:1px solid var(--line);box-shadow:0 25px 90px #000}.modal-card h2{margin:0;color:var(--gold);font-size:32px}.modal-card p{color:#aeb8cc;line-height:1.8}.modal-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
@media(max-width:650px){.app{padding:10px;gap:8px}.top{padding:8px}.brand small{display:none}.pill{min-width:65px;padding:5px}.pill b{font-size:15px}.question-card{min-height:170px;padding:25px 15px}.answers{grid-template-columns:1fr;gap:8px}.answer{min-height:60px}.timer{width:78px;height:78px}.timer b{font-size:24px}.stage-line{font-size:10px}.meter{margin:0 7px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">M</div><div><h1>MR JOO WORLD</h1><small>ENDLESS KNOWLEDGE REALM</small></div></div><div class="hud"><div class="pill"><small>النقاط</small><b id="score">0</b></div><div class="pill"><small>السلسلة</small><b id="streak">0</b></div></div></header>
<main class="main"><section class="arena">
<div class="stage-line"><span id="category" class="category">عام</span><div class="meter"><i id="progress"></i></div><span id="poolInfo">متبقي 0</span></div>
<div class="timer" id="timer"><div><b id="seconds">30</b><small>SEC</small></div></div>
<div class="question-card"><span class="number" id="questionNo">السؤال</span><h2 id="question">جاري تجهيز العالم...</h2><div class="hint" id="hint">كل سؤال يُستخدم مرة واحدة فقط.</div></div>
<div class="answers" id="answers"></div><div class="feedback" id="feedback">اختر إجابتك لفتح المحطة التالية.</div><div class="controls"><button class="btn next" id="next">السؤال التالي</button></div>
</section></main>
<div class="modal" id="modal"><div class="modal-card"><h2 id="modalTitle">أُعيدت الجولة</h2><p id="modalText"></p><div class="modal-actions"><button class="btn restart" id="again">ابدأ بأسئلة جديدة</button><button class="btn" id="newCycle">افتح دورة جديدة</button></div></div></div>
</div>
<script>
const BANK=[
['علوم','ما هو الكوكب المعروف بالكوكب الأحمر؟',['الزهرة','المريخ','عطارد','نبتون'],1],['علوم','ما الغاز الأكثر وفرة في الغلاف الجوي؟',['الأكسجين','النيتروجين','الهيدروجين','الهيليوم'],1],['علوم','ما العضو الذي يضخ الدم؟',['الكبد','القلب','الرئة','المعدة'],1],['علوم','ما الوحدة الأساسية لقياس القوة؟',['جول','نيوتن','واط','فولت'],1],['علوم','ما أكبر عضو في جسم الإنسان؟',['القلب','الجلد','الكبد','الدماغ'],1],['علوم','ما الكوكب الأكبر في المجموعة الشمسية؟',['زحل','المشتري','الأرض','أورانوس'],1],['علوم','ما الجسيم سالب الشحنة؟',['البروتون','النيوترون','الإلكترون','الفوتون'],2],['علوم','ما العملية التي تصنع بها النباتات غذاءها؟',['التنفس','البناء الضوئي','التبخر','التكاثف'],1],['جغرافيا','ما أكبر محيط في العالم؟',['الأطلسي','الهندي','الهادئ','المتجمد'],2],['جغرافيا','ما عاصمة اليابان؟',['بكين','طوكيو','سيول','بانكوك'],1],['جغرافيا','ما أكبر قارة مساحة؟',['أفريقيا','آسيا','أوروبا','أستراليا'],1],['جغرافيا','ما أطول نهر في أمريكا الجنوبية؟',['النيل','الأمازون','الكونغو','دجلة'],1],['جغرافيا','ما عاصمة أستراليا؟',['سيدني','ملبورن','كانبيرا','بيرث'],2],['جغرافيا','ما أكبر جزيرة في العالم؟',['مدغشقر','جرينلاند','جاوة','أيسلندا'],1],['تاريخ','من أول الخلفاء الراشدين؟',['عمر','أبو بكر','عثمان','علي'],1],['تاريخ','أين بُنيت الأهرامات الشهيرة؟',['العراق','مصر','اليونان','الهند'],1],['تاريخ','من قاد المسلمين في معركة حطين؟',['صلاح الدين','خالد بن الوليد','طارق بن زياد','عمرو بن العاص'],0],['تاريخ','في أي عام بدأت الثورة الفرنسية؟',['1776','1789','1800','1815'],1],['تاريخ','من اكتشف أمريكا في الرحلات الأوروبية الشهيرة؟',['كولومبوس','ماركو بولو','نيوتن','ابن بطوطة'],0],['رياضيات','ما ناتج 12 × 8؟',['84','96','108','72'],1],['رياض��ات','ما الجذر التربيعي لـ144؟',['10','12','14','16'],1],['رياضيات','ما قيمة 25% من 200؟',['25','50','75','100'],1],['رياضيات','ما مساحة مستطيل طوله 9 وعرضه 4؟',['13','36','45','18'],1],['رياضيات','ما ناتج 7 + 5 × 3؟',['36','22','26','18'],1],['رياضيات','ما ناتج 9²؟',['72','81','90','99'],1],['دين','ما أول سورة نزلت؟',['الفاتحة','العلق','البقرة','النمل'],1],['دين','كم عدد ركعات صلاة الفجر؟',['2','3','4','1'],0],['دين','في أي شهر يصوم المسلمون؟',['شعبان','رمضان','رجب','ذو الحجة'],1],['دين','إلى أي مدينة هاجر النبي ﷺ؟',['مكة','المدينة المنورة','دمشق','القدس'],1],['دين','ما أول قبلة للمسلمين؟',['المسجد الأقصى','الكعبة','مسجد قباء','غار حراء'],0],['دين','من النبي الذي ابتلعه الحوت؟',['موسى','يونس','يوسف','نوح'],1],['ثقافة','ما علم دراسة الخرائط؟',['علم الفلك','علم الخرائط','علم الأحياء','علم النبات'],1],['ثقافة','ما اللغة الرسمية في البرازيل؟',['الإسبانية','البرتغالية','الفرنسية','الإنجليزية'],1],['ثقافة','ما الآلة التي لها مفاتيح سوداء وبيضاء؟',['الكمان','البيانو','الناي','العود'],1],['ثقافة','ما اسم المجرة التي نعيش فيها؟',['أندروميدا','درب التبانة','سحابة ماجلان','المثلث'],1],['عام','كم عدد أيام الأسبوع؟',['5','6','7','8'],2],['عام','ما الحيوان الملقب بسفينة الصحراء؟',['الحصان','الجمل','الفيل','الأسد'],1],['عام','ما أسرع حيوان بري؟',['الأسد','الفهد','الحصان','الغزال'],1],['عام','كم عدد أسنان الإنسان البالغ غالبًا؟',['28','30','32','36'],2],['عام','ما لون مزج الأزرق مع الأصفر؟',['البنفسجي','الأخضر','البرتقالي','البني'],1]
].map((x,id)=>({id,category:x[0],q:x[1],options:x[2],correct:x[3]}));
const $=id=>document.getElementById(id), letters=['A','B','C','D'];
let used=new Set(JSON.parse(localStorage.getItem('mrjoo_used_questions_v2')||'[]')), score=0,streak=0,current=null,locked=false,timer=null,seconds=30,answeredCount=0;
function save(){localStorage.setItem('mrjoo_used_questions_v2',JSON.stringify([...used]));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextUnused(){let available=BANK.filter(x=>!used.has(x.id));if(!available.length)return null;return available[Math.floor(Math.random()*available.length)]}
function setFeedback(text,type=''){const f=$('feedback');f.textContent=text;f.className='feedback '+type}
function updateHud(){$('score').textContent=score.toLocaleString('en-US');$('streak').textContent=streak;const left=BANK.length-used.size;$('poolInfo').textContent=`متبقي ${left}`;$('progress').style.width=(used.size/BANK.length*100)+'%'}
function timerUI(){$('seconds').textContent=seconds;$('timer').style.setProperty('--time',(seconds/30*100)+'%');$('timer').classList.toggle('danger',seconds<=7)}
function stopTimer(){clearInterval(timer);timer=null}
function startTimer(){stopTimer();seconds=30;timerUI();timer=setInterval(()=>{seconds--;timerUI();if(seconds<=0){stopTimer();lockQuestion(-1)}} ,1000)}
function render(){current=nextUnused();if(!current){$('modalTitle').textContent='اكتملت كل الأسئلة';$('modalText').textContent='أنهيت كل بنك الأسئلة المتاح. يمكنك فتح دورة جديدة لتبدأ بنكًا جديدًا.';$('modal').classList.add('show');return}locked=false;answeredCount++;$('category').textContent=current.category;$('questionNo').textContent=`السؤال ${used.size+1}`;$('question').textContent=current.q;$('answers').innerHTML='';setFeedback('اختر إجابتك لفتح المحطة التالية.');let choices=current.options.map((text,index)=>({text,index}));choices=shuffle(choices);choices.forEach((choice,i)=>{let b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${letters[i]}</span><span>${choice.text}</span>`;b.onclick=()=>lockQuestion(choice.index,b);$('answers').appendChild(b)});$('next').classList.remove('show');updateHud();startTimer()}
function lockQuestion(selected,clicked){if(locked)return;locked=true;stopTimer();used.add(current.id);save();let buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.classList.add('locked'));let correctButton=buttons.find(b=>b.querySelector('span:last-child')?.textContent===current.options[current.correct]);let ok=selected===current.correct;if(correctButton)correctButton.classList.add('correct');if(clicked&&!ok)clicked.classList.add('wrong');if(ok){streak++;let reward=100+seconds*5+streak*15;score+=reward;setFeedback(`إجابة صحيحة — +${reward} نقطة`,'good')}else{streak=0;score=Math.max(0,score-20);setFeedback(selected===-1?`انتهى الوقت — الإجابة الصحيحة: ${current.options[current.correct]}`:`إجابة خاطئة — الصحيحة: ${current.options[current.correct]}`,'bad');}updateHud();$('next').classList.add('show');$('next').textContent=used.size>=BANK.length?'عرض النهاية':'السؤال التالي'}
$('next').onclick=()=>{if(!locked)return;render()};$('again').onclick=()=>{$('modal').classList.remove('show');score=0;streak=0;render()};$('newCycle').onclick=()=>{used.clear();save();score=0;streak=0;$('modal').classList.remove('show');render()};
render();
</script>
</body>
</html>
