<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MR JOO WORLD — Endless Realms</title>
<style>
:root{--gold:#ffd66b;--gold2:#b77a17;--purple:#b66cff;--cyan:#54e7ff;--green:#35e7a1;--red:#ff526f;--panel:#050811d9}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#fff;font-family:Tajawal,Arial,sans-serif}body{touch-action:manipulation}.world{position:fixed;inset:0;background:#05070d center/cover no-repeat;transition:background-image .8s ease,filter .8s ease}.world:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#02040a55 0%,#02040a35 35%,#02040ad9 100%),radial-gradient(circle at 50% 35%,transparent 12%,#0008 100%)}.app{position:relative;z-index:2;width:100%;height:100%;max-width:1180px;margin:auto;padding:clamp(10px,2vw,24px);display:flex;flex-direction:column;gap:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid #ffffff28;border-radius:18px;background:#030711c9;backdrop-filter:blur(15px);box-shadow:0 14px 40px #0009}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,var(--gold),#fff1a9);color:#17100a;font-size:25px;font-weight:1000;box-shadow:0 0 25px #ffd66b77}.brand h1{margin:0;font-size:clamp(17px,2.7vw,30px);background:linear-gradient(90deg,#fff,var(--gold),var(--purple));-webkit-background-clip:text;color:transparent}.brand small{display:block;color:#b5bfd5;font-size:9px;letter-spacing:1px}.hud{display:flex;gap:7px}.pill{min-width:75px;text-align:center;border:1px solid #ffffff20;border-radius:11px;padding:5px 9px;background:#ffffff0b}.pill small{display:block;color:#b3bdd0;font-size:9px}.pill b{font-size:17px;color:var(--gold)}.arena{width:min(920px,100%);margin:auto;display:flex;flex-direction:column;align-items:center;gap:11px;min-height:0}.meta{width:100%;display:flex;align-items:center;justify-content:space-between;color:#d7dbea;font-size:12px;font-weight:800}.meta .gold{color:var(--gold)}.bar{height:5px;flex:1;margin:0 12px;background:#ffffff20;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--cyan),var(--gold));box-shadow:0 0 15px var(--cyan);transition:.3s}.timer{width:88px;height:88px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--time)*1%),#ffffff18 0);box-shadow:0 0 30px #ffd66b44}.timer:before{content:"";position:absolute;width:76px;height:76px;border-radius:50%;background:#050913;border:1px solid #ffffff1c}.timer div{position:relative;text-align:center}.timer b{display:block;color:var(--gold);font-size:27px}.timer small{font-size:8px;letter-spacing:2px;color:#c8d0df}.timer.danger{background:conic-gradient(var(--red) calc(var(--time)*1%),#ffffff18 0);box-shadow:0 0 28px #ff526f88}.timer.danger b{color:var(--red)}.question{position:relative;width:100%;min-height:175px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 24px;background:linear-gradient(135deg,#03070ed9,#11091cdd);border:2px solid #e4b84d99;border-radius:25px;box-shadow:0 20px 70px #000b,inset 0 0 35px #ffffff08;overflow:hidden}.question:before{content:"";position:absolute;inset:9px;border:1px solid #ffffff20;border-radius:18px;pointer-events:none}.question h2{position:relative;margin:0;font-size:clamp(22px,3.2vw,43px);line-height:1.5;text-shadow:0 4px 24px #000}.question span{position:absolute;top:12px;right:16px;color:var(--gold);font-size:11px}.answers{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.answer{min-height:70px;display:flex;align-items:center;gap:12px;text-align:right;border:2px solid #ffffff22;border-radius:17px;background:linear-gradient(135deg,#0a1321e8,#050911ed);color:#fff;padding:10px 14px;cursor:pointer;transition:.2s;box-shadow:0 12px 28px #0008}.answer:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 0 26px #54e7ff33}.answer .letter{width:39px;height:39px;display:grid;place-items:center;flex:0 0 39px;border-radius:12px;color:var(--gold);border:1px solid var(--gold);font-size:20px;font-weight:1000;background:#ffd66b12}.answer .text{font-size:clamp(14px,1.7vw,21px);font-weight:850}.answer.correct{border-color:var(--green);background:#0a3429dd;box-shadow:0 0 28px #35e7a155}.answer.wrong{border-color:var(--red);background:#3b0c18dd;box-shadow:0 0 28px #ff526f55}.answer.locked{pointer-events:none;opacity:.85}.feedback{width:100%;min-height:42px;padding:10px;border-radius:13px;text-align:center;background:#030711c9;border:1px solid #ffffff20;color:#d3dbea;font-size:13px}.feedback.good{color:#aaffd9;border-color:#35e7a166}.feedback.bad{color:#ffc0c9;border-color:#ff526f66}.modal{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:20px;background:#01030bd9;backdrop-filter:blur(12px)}.modal.show{display:grid}.modal-card{width:min(500px,92vw);padding:28px;text-align:center;border-radius:24px;background:#050a15f7;border:1px solid #ffd66b88;box-shadow:0 30px 100px #000}.modal-card h2{margin:0;color:var(--gold);font-size:30px}.modal-card p{color:#b8c2d6;line-height:1.8}.btn{border:0;border-radius:13px;padding:12px 22px;font-weight:900;cursor:pointer}.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#170e05}.dark{background:#ffffff12;color:#fff;border:1px solid #ffffff22;margin-right:8px}@media(max-width:650px){.app{padding:8px;gap:8px}.top{padding:7px}.brand small{display:none}.pill{min-width:62px}.arena{width:100%}.answers{grid-template-columns:1fr;gap:8px}.question{min-height:155px;padding:28px 14px}.answer{min-height:58px}.timer{width:76px;height:76px}.timer:before{width:66px;height:66px}.timer b{font-size:23px}.meta{font-size:10px}.bar{margin:0 7px}}
</style>
</head>
<body>
<div class="world" id="world"></div>
<div class="app"><header class="top"><div class="brand"><div class="logo">M</div><div><h1>MR JOO WORLD</h1><small>REALMS • QUIZ • KNOWLEDGE</small></div></div><div class="hud"><div class="pill"><small>النقاط</small><b id="score">0</b></div><div class="pill"><small>السلسلة</small><b id="streak">0</b></div></div></header>
<main class="arena"><div class="meta"><span class="gold" id="round">الجولة 1 / 4</span><div class="bar"><i id="progress"></i></div><span id="remaining">50 سؤال</span></div><div class="timer" id="timer"><div><b id="seconds">30</b><small>SEC</small></div></div><section class="question"><span id="questionNo">السؤال 1 / 50</span><h2 id="questionText">جاري فتح البوابة...</h2></section><div class="answers" id="answers"></div><div class="feedback" id="feedback">اختر إجابة لفتح المرحلة التالية.</div></main></div>
<div class="modal" id="modal"><div class="modal-card"><h2 id="modalTitle">أكملت الجولة</h2><p id="modalText"></p><button class="btn gold" id="continue">الجولة التالية</button><button class="btn dark" id="reset">دورة جديدة</button></div></div>
<script>
const BANK=[
['علوم','ما الكوكب المعروف بالكوكب الأحمر؟',['الزهرة','المريخ','عطارد','نبتون'],1],['علوم','ما الغاز الأكثر وفرة في الغلاف الجوي؟',['الأكسجين','النيتروجين','الهيدروجين','الهيليوم'],1],['علوم','ما العضو الذي يضخ الدم؟',['الكبد','القلب','الرئة','المعدة'],1],['علوم','ما أكبر عضو في جسم الإنسان؟',['القلب','الجلد','الكبد','الدماغ'],1],['علوم','ما الجسيم سالب الشحنة؟',['البروتون','النيوترون','الإلكترون','الفوتون'],2],['علوم','ما العملية التي تصنع بها النباتات غذاءها؟',['التنفس','البناء الضوئي','التبخ��','التكاثف'],1],['جغرافيا','ما أكبر محيط في العالم؟',['الأطلسي','الهندي','الهادئ','المتجمد'],2],['جغرافيا','ما عاصمة اليابان؟',['بكين','طوكيو','سيول','بانكوك'],1],['جغرافيا','ما أكبر قارة مساحة؟',['أفريقيا','آسيا','أوروبا','أستراليا'],1],['جغرافيا','ما عاصمة أستراليا؟',['سيدني','ملبورن','كانبيرا','بيرث'],2],['تاريخ','من أول الخلفاء الراشدين؟',['عمر','أبو بكر','عثمان','علي'],1],['تاريخ','أين بُنيت الأهرامات الشهيرة؟',['العراق','مصر','اليونان','الهند'],1],['تاريخ','من قاد المسلمين في معركة حطين؟',['صلاح الدين','خالد بن الوليد','طارق بن زياد','عمرو بن العاص'],0],['رياضيات','ما ناتج 12 × 8؟',['84','96','108','72'],1],['رياضيات','ما الجذر التربيعي لـ144؟',['10','12','14','16'],1],['رياضيات','ما قيمة 25% من 200؟',['25','50','75','100'],1],['رياضيات','ما مساحة مستطيل طوله 9 وعرضه 4؟',['13','36','45','18'],1],['دين','ما أول سورة نزلت؟',['الفاتحة','العلق','البقرة','النمل'],1],['دين','كم عدد ركعات صلاة الفجر؟',['2','3','4','1'],0],['دين','إلى أي مدينة هاجر النبي ﷺ؟',['مكة','المدينة المنورة','دمشق','القدس'],1],['دين','ما أول قبلة للمسلمين؟',['المسجد الأقصى','الكعبة','مسجد قباء','غار حراء'],0],['دين','من النبي الذي ابتلعه الحوت؟',['موسى','يونس','يوسف','نوح'],1],['ثقافة','ما علم دراسة الخرائط؟',['علم الفلك','علم الخرائط','علم الأحياء','علم النبات'],1],['ثقافة','ما اللغة الرسمية في البرازيل؟',['الإسبانية','البرتغالية','الفرنسية','الإنجليزية'],1],['ثقافة','ما الآلة التي لها مفاتيح سوداء وبيضاء؟',['الكمان','البيانو','الناي','العود'],1],['عام','كم عدد أيام الأسبوع؟',['5','6','7','8'],2],['عام','ما الحيوان الملقب بسفينة الصحراء؟',['الحصان','الجمل','الفيل','الأسد'],1],['عام','ما أسرع حيوان بري؟',['الأسد','الفهد','الحصان','الغزال'],1],['عام','كم عدد أسنان الإنسان البالغ غالبًا؟',['28','30','32','36'],2],['عام','ما لون مزج الأزرق مع الأصفر؟',['البنفسجي','الأخضر','البرتقالي','البني'],1]
].map((x,id)=>({id,category:x[0],q:x[1],options:x[2],correct:x[3]}));
const backgrounds=['assets/round-purple.jpg','assets/round-green.jpg','assets/round-blue.jpg','assets/round-gold.jpg'];
const $=id=>document.getElementById(id),letters=['A','B','C','D'];
let saved=JSON.parse(localStorage.getItem('mrjoo_rounds_v3')||'null')||{cycle:0,total:0,round:0,index:0,used:[],score:0,streak:0};let current,locked=false,timer=null,seconds=30;
function save(){localStorage.setItem('mrjoo_rounds_v3',JSON.stringify(saved))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setBg(){const w=$('world');w.style.backgroundImage=`linear-gradient(180deg,#01030a42,#01030acc),url("${backgrounds[saved.round%backgrounds.length]}")`;w.style.backgroundSize='cover';w.style.backgroundPosition='center';}
function update(){ $('score').textContent=saved.score.toLocaleString('en-US');$('streak').textContent=saved.streak;$('round').textContent=`الجولة ${saved.round+1} / 4`;$('questionNo').textContent=`السؤال ${saved.index+1} / 50`;$('remaining').textContent=`${50-saved.index} سؤال`;$('progress').style.width=(saved.index/50*100)+'%';setBg()}
function timerUI(){$('seconds').textContent=seconds;$('timer').style.setProperty('--time',(seconds/30*100)+'%');$('timer').classList.toggle('danger',seconds<=7)}
function stop(){clearInterval(timer)}function start(){stop();seconds=30;timerUI();timer=setInterval(()=>{seconds--;timerUI();if(seconds<=0){stop();answer(-1)}},1000)}
function makeQuestion(){let available=BANK.filter(q=>!saved.used.includes(q.id));if(!available.length){saved.used=[];available=BANK}current=available[Math.floor(Math.random()*available.length)];saved.used.push(current.id);if(saved.used.length>BANK.length)saved.used.shift();let items=shuffle(current.options.map((text,index)=>({text,index})));$('category').textContent=current.category;$('questionText').textContent=current.q;$('answers').innerHTML='';items.forEach((it,i)=>{let b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${letters[i]}</span><span class="text">${it.text}</span>`;b.onclick=()=>answer(it.index,b);$('answers').appendChild(b)});$('feedback').textContent='اختر إجابة لفتح المرحلة التالية.';$('feedback').className='feedback';locked=false;update();start()}
function answer(index,clicked){if(locked)return;locked=true;stop();let buttons=[...document.querySelectorAll('.answer')],correctText=current.options[current.correct];let correctBtn=buttons.find(b=>b.querySelector('.text')?.textContent===correctText);if(correctBtn)correctBtn.classList.add('correct');if(clicked&&index!==current.correct)clicked.classList.add('wrong');buttons.forEach(b=>b.classList.add('locked'));if(index===current.correct){saved.streak++;saved.score+=100+seconds*5+saved.streak*10;$('feedback').textContent='إجابة صحيحة!';$('feedback').className='feedback good'}else{saved.streak=0;saved.score=Math.max(0,saved.score-20);$('feedback').textContent=index===-1?`انتهى الوقت — الصحيحة: ${correctText}`:`إجابة خاطئة — الصحيحة: ${correctText}`;$('feedback').className='feedback bad'}saved.index++;saved.total++;save();update();setTimeout(()=>{if(saved.index>=50){saved.round++;saved.index=0;saved.used=[];save();$('modalText').textContent=`أتممت الجولة بنجاح. الخلفية ستتغير الآن، وستبدأ 50 سؤالًا جديدة.`;$('modal').classList.add('show')}else makeQuestion()},900)}
$('continue').onclick=()=>{$('modal').classList.remove('show');makeQuestion()};$('reset').onclick=()=>{saved={cycle:saved.cycle+1,total:0,round:0,index:0,used:[],score:0,streak:0};save();$('modal').classList.remove('show');makeQuestion()};
makeQuestion();
</script></body></html>
